<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Voter - Secure E-Voting Platform</title>
    <!-- Face-api.js -->
    <script src="../../lib/face-api.min.js"></script>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="register-voter.css">
    <link rel="stylesheet" href="../../shared/toast.css">
    <link rel="stylesheet" href="../../shared/spinner.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <header class="top-header">
        <div class="header-left">
            <h1>Admin Dashboard</h1>
            <p>Citizen Enrollment & Biometric Registration</p>
        </div>
        <a href="../../login/login.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
    </header>

    <main class="container">
        <nav class="tab-nav">
            <a href="../../admin/dashboard/dashboard.html" class="tab"><i class="fas fa-chart-line"></i> Overview</a>
            <a href="../../admin/voters/voters.html" class="tab"><i class="fas fa-users"></i> Voters (0)</a>
            <a href="../../admin/parties/parties.html" class="tab"><i class="fas fa-building"></i> Parties (0)</a>
            <a href="../../admin/results/results.html" class="tab"><i class="fas fa-poll"></i> Results</a>
            <a href="../../admin/register-voter/register-voter.html" class="tab active"><i class="fas fa-user-plus"></i> Register Voter</a>
            <a href="../../admin/register-party/register-party.html" class="tab"><i class="fas fa-plus"></i> Register Party</a>
        </nav>

        <section class="stats-grid">
            <div class="stat-card" style="cursor: pointer;">
                <div>
                    <span class="label">Citizen Enrollment</span>
                    <h2 class="value" style="font-size: 1.3rem;">Register New Eligible Voter</h2>
                </div>
                <button class="icon-box green" title="Open Registration Form"><i class="fas fa-user-plus"></i></button>
            </div>
        </section>

        <div id="addvoter" class="hidden">
            <div class="card">
                <div style="margin-bottom: var(--space-6); padding-bottom: var(--space-4); border-bottom: 1px solid var(--border);">
                    <h2>Voter Registration Form</h2>
                    <p>Enter citizen identity details and capture facial biometric embedding</p>
                </div>

                <form id="registerForm">
                    <div class="form-grid">
                        <div class="row">
                            <div class="form-group">
                                <label for="fullName">Full Legal Name</label>
                                <input type="text" id="fullName" placeholder="e.g. Eleanor Vance" required>
                            </div>
                            <div class="form-group">
                                <label for="voterId">Government ID / Voter Number</label>
                                <input type="text" id="voterId" placeholder="e.g. VTR-99824" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="form-group">
                                <label for="email">Portal User Handle</label>
                                <input type="text" id="email" placeholder="e.g. eleanor (auto-formats as eleanor@voter)" required>
                            </div>
                            <div class="form-group">
                                <label for="password">Account Password</label>
                                <input type="password" id="password" placeholder="Min. 8 characters" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="form-group">
                                <label for="dob">Date of Birth</label>
                                <input type="date" id="dob" required>
                            </div>
                            <div class="form-group">
                                <label for="address">Residential Address</label>
                                <input type="text" id="address" placeholder="e.g. 104 Civic Square, Precinct 4" required>
                            </div>
                        </div>
                    </div>

                    <div class="button-group">
                        <button type="button" class="cancel-btn">Cancel</button>
                        <button type="submit" class="submit-btn">
                            <i class="fas fa-camera"></i> Continue to Face Capture
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../../shared/spinner.js"></script>
    <script src="../../shared/toast.js"></script>
    <script src="register-voter.js"></script>
</body>

</html>
