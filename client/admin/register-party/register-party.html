<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Party - Secure E-Voting Platform</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="register-party.css">
    <link rel="stylesheet" href="../../shared/toast.css">
    <link rel="stylesheet" href="../../shared/spinner.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <header class="top-header">
        <div class="header-left">
            <h1>Admin Dashboard</h1>
            <p>Party Accreditation & Candidate Slate Registration</p>
        </div>
        <a href="../../login/login.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
    </header>

    <main class="container">
        <nav class="tab-nav">
            <a href="../../admin/dashboard/dashboard.html" class="tab"><i class="fas fa-chart-line"></i> Overview</a>
            <a href="../../admin/voters/voters.html" class="tab"><i class="fas fa-users"></i> Voters (0)</a>
            <a href="../../admin/parties/parties.html" class="tab"><i class="fas fa-building"></i> Parties (0)</a>
            <a href="../../admin/results/results.html" class="tab"><i class="fas fa-poll"></i> Results</a>
            <a href="../../admin/register-voter/register-voter.html" class="tab"><i class="fas fa-user-plus"></i> Register Voter</a>
            <a href="../../admin/register-party/register-party.html" class="tab active"><i class="fas fa-plus"></i> Register Party</a>
        </nav>

        <section class="stats-grid">
            <div class="rstat-card" style="cursor: pointer;">
                <div>
                    <span class="label">Party Accreditation</span>
                    <h2 class="value" style="font-size: 1.3rem;">Register New Political Party</h2>
                </div>
                <button class="icon-box purple" title="Open Registration Form"><i class="fas fa-plus"></i></button>
            </div>
        </section>

        <div id="addparty" class="hidden">
            <div class="card">
                <div style="margin-bottom: var(--space-6); padding-bottom: var(--space-4); border-bottom: 1px solid var(--border);">
                    <h2>Register Political Party</h2>
                    <p>Accredit a new party and assign official electoral ballot symbols</p>
                </div>

                <form id="partyForm">
                    <div class="field-group">
                        <label for="partyName">Official Party Name</label>
                        <input type="text" id="partyName" placeholder="e.g. Democratic Alliance" required>
                    </div>

                    <div class="field-group">
                        <label>Official Ballot Symbol</label>
                        <div class="symbol-grid" id="symbolGrid">
                            <button type="button" class="symbol-btn" data-symbol="🗽" title="Liberty">🗽</button>
                            <button type="button" class="symbol-btn" data-symbol="🌱" title="Ecology">🌱</button>
                            <button type="button" class="symbol-btn" data-symbol="🤝" title="Solidarity">🤝</button>
                            <button type="button" class="symbol-btn" data-symbol="⭐" title="Progress">⭐</button>
                            <button type="button" class="symbol-btn" data-symbol="🎯" title="Focus">🎯</button>
                            <button type="button" class="symbol-btn" data-symbol="🔥" title="Energy">🔥</button>
                            <button type="button" class="symbol-btn" data-symbol="💡" title="Innovation">💡</button>
                            <button type="button" class="symbol-btn" data-symbol="🌟" title="Excellence">🌟</button>
                            <button type="button" class="symbol-btn" data-symbol="🏛️" title="Constitution">🏛️</button>
                            <button type="button" class="symbol-btn" data-symbol="🦅" title="Sovereignty">🦅</button>
                        </div>
                        <input type="hidden" id="symbol" value="">
                    </div>

                    <div class="field-group">
                        <label for="description">Short Description / Motto</label>
                        <input type="text" id="description" placeholder="e.g. For Transparent Governance and Economic Growth">
                    </div>

                    <div class="field-group">
                        <label for="manifesto">Party Platform / Manifesto Summary</label>
                        <textarea id="manifesto" placeholder="Core legislative priorities and constitutional commitments"></textarea>
                    </div>

                    <div class="row">
                        <div class="field-group">
                            <label for="email">Party Portal Handle</label>
                            <input type="text" id="email" placeholder="e.g. alliance (auto-formats as alliance@party)" required>
                        </div>
                        <div class="field-group">
                            <label for="password">Portal Password</label>
                            <input type="password" id="password" placeholder="Min. 8 characters" required>
                        </div>
                    </div>

                    <div class="actions">
                        <button type="button" class="btn-secondary">Cancel</button>
                        <button type="submit" class="btn-primary"><i class="fas fa-check"></i> Register Party</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../../shared/spinner.js"></script>
    <script src="../../shared/toast.js"></script>
    <script src="register-party.js"></script>
</body>

</html>
