<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Political Parties Catalog - SecureVote Admin</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="parties.css">
    <link rel="stylesheet" href="../../shared/toast.css">
    <link rel="stylesheet" href="../../shared/spinner.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <div class="app-shell">
        <!-- Sidebar -->
        <aside class="app-sidebar" id="appSidebar">
            <div class="sidebar-header">
                <a href="../dashboard/dashboard.html" class="brand-logo">
                    <div class="brand-icon"><i class="fas fa-vote-yea"></i></div>
                    <span>SecureVote</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <span class="nav-section-title">Operations</span>
                <a href="../dashboard/dashboard.html" class="nav-link">
                    <i class="fas fa-chart-line"></i> <span>Dashboard</span>
                </a>
                <a href="../voters/voters.html" class="nav-link">
                    <i class="fas fa-users"></i> <span>Voters Roll</span>
                </a>
                <a href="parties.html" class="nav-link active">
                    <i class="fas fa-landmark"></i> <span>Parties Catalog</span>
                </a>
                <a href="../results/results.html" class="nav-link">
                    <i class="fas fa-poll"></i> <span>Live Results</span>
                </a>

                <span class="nav-section-title">Registration</span>
                <a href="../register-voter/register-voter.html" class="nav-link">
                    <i class="fas fa-user-plus"></i> <span>Register Voter</span>
                </a>
                <a href="../register-party/register-party.html" class="nav-link">
                    <i class="fas fa-plus-circle"></i> <span>Register Party</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile-badge">
                    <div class="user-avatar"><i class="fas fa-user-shield"></i></div>
                    <div class="user-info-text">
                        <strong id="adminUserName">Electoral Admin</strong>
                        <span>Administrator</span>
                    </div>
                </div>
                <a href="../../login/login.html" class="logout-nav-btn">
                    <i class="fas fa-sign-out-alt"></i> Sign Out
                </a>
            </div>
        </aside>

        <!-- Main -->
        <div class="app-main">
            <header class="app-topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle Navigation">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="page-title-group">
                        <h1>Accredited Political Parties</h1>
                        <p>Certified Candidate Catalog & Electoral Symbols</p>
                    </div>
                </div>

                <div class="topbar-right">
                    <a href="../register-party/register-party.html" class="btn-primary" style="padding: 8px 16px; font-size: 0.85rem;">
                        <i class="fas fa-plus-circle"></i> Register New Party
                    </a>
                </div>
            </header>

            <main class="page-content">
                <div class="section-card">
                    <div class="party-list" id="partiesContainer" style="box-shadow: none; border: none; padding: 0; margin: 0;">
                        <!-- Injected by parties.js -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../../shared/spinner.js"></script>
    <script src="../../shared/toast.js"></script>
    <script src="../../shared/auth.js"></script>
    <script src="parties.js"></script>
</body>

</html>
