<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Results & Visual Analytics - Secure E-Voting Platform</title>
    <link rel="stylesheet" href="../../styles/main.css">
    <link rel="stylesheet" href="results.css">
    <link rel="stylesheet" href="../../shared/toast.css">
    <link rel="stylesheet" href="../../shared/spinner.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Chart.js for interactive analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>

    <header class="top-header">
        <div class="header-left">
            <h1>Admin Dashboard</h1>
            <p>Live Cryptographic Results & Visual Tally Analytics</p>
        </div>
        <a href="../../login/login.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
    </header>

    <main class="container">
        <nav class="tab-nav">
            <a href="../../admin/dashboard/dashboard.html" class="tab"><i class="fas fa-chart-line"></i> Overview</a>
            <a href="../../admin/voters/voters.html" class="tab"><i class="fas fa-users"></i> Voters (0)</a>
            <a href="../../admin/parties/parties.html" class="tab"><i class="fas fa-building"></i> Parties (0)</a>
            <a href="../../admin/results/results.html" class="tab active"><i class="fas fa-poll"></i> Results</a>
            <a href="../../admin/register-voter/register-voter.html" class="tab"><i class="fas fa-user-plus"></i> Register Voter</a>
            <a href="../../admin/register-party/register-party.html" class="tab"><i class="fas fa-plus"></i> Register Party</a>
        </nav>

        <!-- Visual Analytics Grid -->
        <section class="charts-grid" id="chartsSection">
            <div class="chart-card">
                <h4><span><i class="fas fa-chart-pie" style="color: var(--primary);"></i> Vote Share Distribution</span> <span id="totalVotesBadge" class="list-count blue-text">0 Ballots</span></h4>
                <div class="chart-container">
                    <canvas id="voteDoughnutChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h4><span><i class="fas fa-chart-bar" style="color: var(--success);"></i> Candidate Vote Count</span> <span class="list-count green-text">Certified</span></h4>
                <div class="chart-container">
                    <canvas id="voteBarChart"></canvas>
                </div>
            </div>
        </section>

        <section class="party-list">
            <h3>Certified Ballot Box Tally</h3>
            <!-- Results cards dynamically injected by results.js -->
        </section>
    </main>

    <script src="../../shared/spinner.js"></script>
    <script src="../../shared/toast.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="results.js"></script>
</body>

</html>
