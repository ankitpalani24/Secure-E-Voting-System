<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cast Ballot - Secure E-Voting Platform</title>
    <!-- Face-api.js -->
    <script src="../lib/face-api.min.js"></script>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="v-vote.css">
    <link rel="stylesheet" href="../shared/toast.css">
    <link rel="stylesheet" href="../shared/spinner.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

    <header class="top-header">
        <div class="header-left">
            <h1>Citizen Portal</h1>
            <p>Welcome, Voter</p>
        </div>
        <a href="../login/login.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
    </header>

    <main class="container">
        <nav class="tab-nav">
            <a href="v-dashboard.html" class="tab"><i class="fas fa-id-card"></i> Voter Status</a>
            <a href="v-vote.html" class="tab active"><i class="fas fa-vote-yea"></i> Cast Ballot</a>
            <a href="v-result.html" class="tab"><i class="fas fa-poll"></i> Election Results</a>
        </nav>

        <section class="stats-grid">
            <div class="vstat-card">
                <div>
                    <h6 class="value" style="font-size: 1.25rem;">Electoral Status</h6>
                    <span class="label">Ready to vote</span>
                </div>
                <div class="icon-box green"><i class="fas fa-check"></i></div>
            </div>
        </section>

        <section class="party-list">
            <h3>Official Accredited Ballot Candidates</h3>
            <!-- Party selection cards dynamically injected by v-vote.js -->
        </section>
    </main>

    <script src="../shared/spinner.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="v-vote.js"></script>
</body>

</html>
