<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certified Election Results - SecureVote</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="v-result.css">
    <link rel="stylesheet" href="../shared/toast.css">
    <link rel="stylesheet" href="../shared/spinner.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>

    <div class="app-shell">
        <!-- Sidebar -->
        <aside class="app-sidebar" id="appSidebar">
            <div class="sidebar-header">
                <a href="v-dashboard.html" class="brand-logo">
                    <div class="brand-icon"><i class="fas fa-vote-yea"></i></div>
                    <span>SecureVote</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <span class="nav-section-title">Citizen Portal</span>
                <a href="v-dashboard.html" class="nav-link">
                    <i class="fas fa-id-card"></i> <span>Voter Status</span>
                </a>
                <a href="v-vote.html" class="nav-link">
                    <i class="fas fa-vote-yea"></i> <span>Cast Ballot</span>
                </a>
                <a href="v-result.html" class="nav-link active">
                    <i class="fas fa-poll"></i> <span>Election Results</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <div class="user-profile-badge">
                    <div class="user-avatar"><i class="fas fa-user"></i></div>
                    <div class="user-info-text">
                        <strong id="voterProfileName">Citizen Voter</strong>
                        <span>Accredited Voter</span>
                    </div>
                </div>
                <a href="../login/login.html" class="logout-nav-btn">
                    <i class="fas fa-sign-out-alt"></i> Sign Out
                </a>
            </div>
        </aside>

        <!-- Main -->
        <div class="app-main">
            <header class="app-topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle Navigation">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="page-title-group">
                        <h1>Certified Election Standings</h1>
                        <p>Live Cryptographic Result Aggregation</p>
                    </div>
                </div>

                <div class="topbar-right">
                    <div class="status-badge live" id="voterTotalBadge">
                        0 Ballots Cast
                    </div>
                    <a href="../login/login.html" class="logout-nav-btn logout-btn">
                        <i class="fas fa-sign-out-alt"></i> Sign Out
                    </a>
                </div>
            </header>

            <main class="page-content">
                <!-- Visual Analytics Grid -->
                <section class="charts-grid" id="chartsSection">
                    <div class="chart-card">
                        <div class="section-header">
                            <h3><i class="fas fa-chart-pie" style="color: var(--primary);"></i> Vote Share Breakdown</h3>
                        </div>
                        <div class="chart-container">
                            <canvas id="voterDoughnutChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-card">
                        <div class="section-header">
                            <h3><i class="fas fa-chart-bar" style="color: var(--success);"></i> Live Standings</h3>
                        </div>
                        <div class="chart-container">
                            <canvas id="voterBarChart"></canvas>
                        </div>
                    </div>
                </section>

                <div class="section-card">
                    <div class="section-header">
                        <h3><i class="fas fa-trophy" style="color: var(--warning);"></i> Certified Candidate Leaderboard</h3>
                    </div>
                    <div class="party-list" id="voterResultsContainer" style="box-shadow: none; border: none; padding: 0; margin: 0;">
                        <!-- Injected by v-result.js -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../shared/spinner.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="../shared/auth.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="v-result.js"></script>
</body>

</html>
