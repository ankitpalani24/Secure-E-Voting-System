<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Election Results - Secure E-Voting Platform</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="v-result.css">
    <link rel="stylesheet" href="../shared/toast.css">
    <link rel="stylesheet" href="../shared/spinner.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>

    <header class="top-header">
        <div class="header-left">
            <h1>Citizen Portal</h1>
            <p>Welcome, Voter</p>
        </div>
        <a href="../login/login.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
    </header>

    <main class="container">
        <nav class="tab-nav">
            <a href="v-dashboard.html" class="tab"><i class="fas fa-id-card"></i> Voter Status</a>
            <a href="v-vote.html" class="tab"><i class="fas fa-vote-yea"></i> Cast Ballot</a>
            <a href="v-result.html" class="tab active"><i class="fas fa-poll"></i> Election Results</a>
        </nav>

        <!-- Visual Analytics Grid -->
        <section class="charts-grid" id="chartsSection">
            <div class="chart-card">
                <h4><span><i class="fas fa-chart-pie" style="color: var(--primary);"></i> Vote Share Breakdown</span> <span id="voterTotalBadge" class="list-count blue-text">0 Ballots</span></h4>
                <div class="chart-container">
                    <canvas id="voterDoughnutChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h4><span><i class="fas fa-chart-bar" style="color: var(--success);"></i> Live Standings</span> <span class="list-count green-text">Encrypted Tally</span></h4>
                <div class="chart-container">
                    <canvas id="voterBarChart"></canvas>
                </div>
            </div>
        </section>

        <section class="party-list">
            <h3>Certified Election Tally</h3>
            <!-- Results dynamically injected by v-result.js -->
        </section>
    </main>

    <script src="../shared/spinner.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="https://cdn.socket.io/4.7.4/socket.io.min.js"></script>
    <script src="v-result.js"></script>
</body>

</html>
