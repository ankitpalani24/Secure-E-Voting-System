<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Results & Analytics - SecureVote</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="p-result.css">
    <link rel="stylesheet" href="../shared/toast.css">
    <link rel="stylesheet" href="../shared/spinner.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>

    <div class="app-shell">
        <!-- Sidebar -->
        <aside class="app-sidebar" id="appSidebar">
            <div class="sidebar-header">
                <a href="p-parties.html" class="brand-logo">
                    <div class="brand-icon"><i class="fas fa-vote-yea"></i></div>
                    <span>SecureVote</span>
                </a>
            </div>

            <nav class="sidebar-nav">
                <span class="nav-section-title">Party Representative</span>
                <a href="p-parties.html" class="nav-link">
                    <i class="fas fa-landmark"></i> <span>Candidate Catalog</span>
                </a>
                <a href="p-result.html" class="nav-link active">
                    <i class="fas fa-poll"></i> <span>Election Results</span>
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="../login/login.html" class="logout-nav-btn">
                    <i class="fas fa-sign-out-alt"></i> Sign Out
                </a>
            </div>
        </aside>

        <!-- Main -->
        <div class="app-main">
            <header class="app-topbar">
                <div class="topbar-left">
                    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle Navigation">
                        <i class="fas fa-bars"></i>
                    </button>
                    <div class="page-title-group">
                        <h1>Party Election Results & Analytics</h1>
                        <p>Certified Decentralized Ballot Box Tally</p>
                    </div>
                </div>

                <div class="topbar-right">
                    <div class="status-badge live" id="partyTotalBadge">
                        0 Ballots Cast
                    </div>
                </div>
            </header>

            <main class="page-content">
                <!-- Visual Analytics Grid -->
                <section class="charts-grid" id="chartsSection">
                    <div class="chart-card">
                        <div class="section-header">
                            <h3><i class="fas fa-chart-pie" style="color: var(--primary);"></i> Ballot Share Distribution</h3>
                        </div>
                        <div class="chart-container">
                            <canvas id="partyDoughnutChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-card">
                        <div class="section-header">
                            <h3><i class="fas fa-chart-bar" style="color: var(--success);"></i> Electoral Standings</h3>
                        </div>
                        <div class="chart-container">
                            <canvas id="partyBarChart"></canvas>
                        </div>
                    </div>
                </section>

                <div class="section-card">
                    <div class="section-header">
                        <h3><i class="fas fa-list-ol" style="color: var(--warning);"></i> Certified Candidate Leaderboard</h3>
                    </div>
                    <div class="party-list" id="partyResultsList" style="box-shadow: none; border: none; padding: 0; margin: 0;">
                        <!-- Results dynamically injected by p-result.js -->
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="../shared/spinner.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="p-result.js"></script>
</body>

</html>
