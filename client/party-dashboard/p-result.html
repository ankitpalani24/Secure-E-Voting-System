<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Party Results - Secure E-Voting Platform</title>
    <link rel="stylesheet" href="../styles/main.css">
    <link rel="stylesheet" href="p-result.css">
    <link rel="stylesheet" href="../shared/toast.css">
    <link rel="stylesheet" href="../shared/spinner.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>

    <header class="top-header">
        <div class="header-left">
            <h1>Party Portal</h1>
            <p>Accredited Political Representative Dashboard</p>
        </div>
        <a href="../login/login.html" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Sign Out</a>
    </header>

    <main class="container">
        <nav class="tab-nav">
            <a href="../party-dashboard/p-parties.html" class="tab"><i class="fas fa-building"></i> Registered Parties (0)</a>
            <a href="../party-dashboard/p-result.html" class="tab active"><i class="fas fa-poll"></i> Election Results</a>
        </nav>

        <!-- Visual Analytics Grid -->
        <section class="charts-grid" id="chartsSection">
            <div class="chart-card">
                <h4><span><i class="fas fa-chart-pie" style="color: var(--primary);"></i> Ballot Share Distribution</span> <span id="partyTotalBadge" class="list-count blue-text">0 Ballots</span></h4>
                <div class="chart-container">
                    <canvas id="partyDoughnutChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h4><span><i class="fas fa-chart-bar" style="color: var(--success);"></i> Electoral Standings</span> <span class="list-count green-text">Decentralized Count</span></h4>
                <div class="chart-container">
                    <canvas id="partyBarChart"></canvas>
                </div>
            </div>
        </section>

        <section class="party-list">
            <h3>Certified Election Tally</h3>
            <!-- Results dynamically injected by p-result.js -->
        </section>
    </main>

    <script src="../shared/spinner.js"></script>
    <script src="../shared/toast.js"></script>
    <script src="p-result.js"></script>
</body>

</html>
